  <body>
    <!-- Header/ l'entete -->
    <header>
      <!-- Logo -->
      <div class="header_logo" id="logo">
        <img src="../../images/profil.png" alt="Logo">

      <!-- Menu -->
      <nav class="header_navbar">
        <ul>
          <li>
            <a href="../../index.html">Accueil</a>
          </li>
          <li>

          </li>
          <li>
            <a href="../../pages/projects.html">Projets</a>
          </li>
          <li>
            <a href="../../pages/experiences.html">Experiences</a>

          </li>
          <li>
            <a href="../../pages/contact.html">Contactez-Moi</a>
          </li>

        </ul>

      <!-- Fin Banner/ Fin de la banniere -->

      <section class="products">
      </section>
